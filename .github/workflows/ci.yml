name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality (clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Formatting is not checked here: the public mirror is generated by stripping
      # comments from the source tree, so it is not rustfmt-clean by construction.
      # `cargo fmt --check` stays part of the local delivery gate (quality.sh).
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: test (CPU; GPU cases skipped, hosted runners have no device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Hosted runners have no GPU device. A software Vulkan driver (lavapipe)
      # is installed so the GPU correctness tests still execute against a real
      # adapter; the benchmark-style comparisons are skipped because a software
      # device cannot say anything about GPU/CPU speed.
      # builds a device fails. The eleven such tests are skipped explicitly
      # instead of failing, and everything else still runs; locally they stay
      # mandatory.
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Test
        run: |
          cargo test --locked --workspace --all-features -- \
            --skip tests::crossover_scan_small_n \
            --skip tests::crossover_scan_intensity \
            --skip tests::crossover_formal_measurement \
            --skip tests::artifact_round_trip_through_disk_runs_and_matches_wasm \
            --skip tests::whole_program_split_across_cpu_and_gpu

  eval:
    name: eval (Gate 1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --locked --release -p heterowasm-cli

      - name: Run the corpus evaluation
        run: |
          set -o pipefail
          ./target/release/heterowasm eval 2>/dev/null | tee eval.txt
          if ! grep -qE '^  GO$' eval.txt; then
            echo "::error::Gate 1 did not pass"
            exit 1
          fi
          if grep -q ' FAIL' eval.txt; then
            echo "::error::an eval criterion failed"
            exit 1
          fi
